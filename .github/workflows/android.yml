name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/hermes-studio-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-studio-android-debug
          path: out/hermes-studio-android-debug.apk

      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          body: |
            Debug APK built from `main` (${{ github.sha }}).

            Install on Android: download the `.apk`, then allow installation from
            unknown sources when prompted.
          files: out/hermes-studio-android-debug.apk
          prerelease: true
